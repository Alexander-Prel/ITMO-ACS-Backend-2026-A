name: Refresh coursework dependencies
on:
  push:
    branches: [semester-2-practice]
    paths: ['.github/workflows/refresh-dependencies.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semester-2-practice
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve compatible patched dependencies
        working-directory: БР1.1/Прель Александр/labs/lab2
        run: |
          npm pkg delete overrides.express
          npm pkg set 'overrides.typeorm.glob=^14.0.2'
          npm update --package-lock-only
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev
      - name: Commit verified package manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'БР1.1/Прель Александр/labs/lab2/package.json' 'БР1.1/Прель Александр/labs/lab2/package-lock.json'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): update compatible backend dependencies'
            git push origin HEAD:semester-2-practice
          fi
