apiVersion: v1
kind: Service
metadata:
  name: accounts
  namespace: booking-sem2
spec:
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: accounts
---
apiVersion: v1
kind: Service
metadata:
  name: bookings
  namespace: booking-sem2
spec:
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: bookings
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: booking-sem2
spec:
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: catalog
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: booking-sem2
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: gateway
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: booking-sem2
spec:
  clusterIP: None
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: notifications
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: booking-sem2
spec:
  clusterIP: None
  ports:
  - port: 5672
    targetPort: 5672
  selector:
    app: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: booking-sem2
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: APP_NETWORK_MODE
          value: compose
        - name: GATEWAY_PORT
          value: "3000"
        - name: ACCOUNTS_URL
          value: http://accounts:3000
        - name: CATALOG_URL
          value: http://catalog:3000
        - name: BOOKINGS_URL
          value: http://bookings:3000
        - name: NOTIFICATIONS_URL
          value: http://notifications:3000
        - name: MESSAGING_ENABLED
          value: "true"
        image: ghcr.io/alexander-prel/itmo-booking-gateway@sha256:fbfba0c87365ccc7dff40103ac733678c6a0fd20dbc6333514ad08ce3dd46424
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 9
        name: gateway
        ports:
        - containerPort: 3000
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 9
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 9
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: gateway
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: accounts
  namespace: booking-sem2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  serviceName: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: APP_NETWORK_MODE
          value: compose
        - name: ACCOUNTS_PORT
          value: "3000"
        - name: ACCOUNTS_URL
          value: http://accounts:3000
        - name: CATALOG_URL
          value: http://catalog:3000
        - name: BOOKINGS_URL
          value: http://bookings:3000
        - name: NOTIFICATIONS_URL
          value: http://notifications:3000
        - name: ACCOUNTS_DATABASE_PATH
          value: /app/data/accounts.sqlite
        - name: SERVICE_KEY
          valueFrom:
            secretKeyRef:
              key: SERVICE_KEY
              name: booking-secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: booking-secrets
        image: ghcr.io/alexander-prel/itmo-booking-accounts@sha256:0b77c14281b11486c28f7ae08c81cb450d761ad136d9128803398ed5436bbb5f
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 9
        name: accounts
        ports:
        - containerPort: 3000
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 9
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 9
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /app/data
          name: data
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
