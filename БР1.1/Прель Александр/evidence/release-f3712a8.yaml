spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  serviceName: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          value: itmo
        - name: RABBITMQ_DEFAULT_VHOST
          value: itmo
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: RABBITMQ_PASSWORD
              name: booking-secrets
        image: rabbitmq:4.3.5-management@sha256:8cbda4973b3053f3e3f76f4c28edcad1802896aec5a6e781ebc23bf1eb8273aa
        name: rabbitmq
        ports:
        - containerPort: 5672
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: 5672
        resources:
          limits:
            cpu: "1"
            memory: 768Mi
          requests:
            cpu: 150m
            memory: 256Mi
        startupProbe:
          failureThreshold: 50
          periodSeconds: 5
          tcpSocket:
            port: 5672
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: data
      enableServiceLinks: false
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: booking-sem2
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: booking-sem2
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
