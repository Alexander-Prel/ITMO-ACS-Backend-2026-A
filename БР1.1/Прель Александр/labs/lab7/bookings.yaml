apiVersion: v1
kind: Service
metadata:
  name: bookings
spec:
  selector:
    app: bookings
  ports:
  - port: 3000
    targetPort: 3000
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookings
spec:
  selector:
    matchLabels: &id001
      app: bookings
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bookings
        image: booking-bookings
        ports:
        - containerPort: 3000
        env:
        - name: APP_NETWORK_MODE
          value: compose
        - name: BOOKINGS_PORT
          value: '3000'
        - name: ACCOUNTS_URL
          value: http://accounts:3000
        - name: CATALOG_URL
          value: http://catalog:3000
        - name: BOOKINGS_URL
          value: http://bookings:3000
        - name: NOTIFICATIONS_URL
          value: http://notifications:3000
        - name: BOOKINGS_DATABASE_PATH
          value: /app/data/bookings.sqlite
        - name: SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: booking-secrets
              key: SERVICE_KEY
        - name: MESSAGING_ENABLED
          value: 'true'
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booking-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: amqp://itmo:$(RABBITMQ_PASSWORD)@rabbitmq:5672/itmo?heartbeat=2
        - name: RABBITMQ_NAMESPACE
          value: itmo.booking
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 9
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 9
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 9
          failureThreshold: 40
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/data
      volumes:
      - name: tmp
        emptyDir: {}
  replicas: 1
  serviceName: bookings
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
