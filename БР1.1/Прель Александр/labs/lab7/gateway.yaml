apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels: &id001
      app: gateway
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: booking-gateway
        ports:
        - containerPort: 3000
        env:
        - name: APP_NETWORK_MODE
          value: compose
        - name: GATEWAY_PORT
          value: '3000'
        - name: ACCOUNTS_URL
          value: http://accounts:3000
        - name: CATALOG_URL
          value: http://catalog:3000
        - name: BOOKINGS_URL
          value: http://bookings:3000
        - name: NOTIFICATIONS_URL
          value: http://notifications:3000
        - name: MESSAGING_ENABLED
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 9
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 9
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 9
          failureThreshold: 40
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
