global:
  scrape_interval: 10s
scrape_configs:
  - job_name: vm
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: booking-health
    metrics_path: /probe
    params: {module: [booking_http]}
    static_configs:
      - targets:
          - http://gateway:3000/ready
          - http://accounts:3000/health
          - http://catalog:3000/health
          - http://bookings:3000/ready
          - http://notifications:3000/ready
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
