services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [monitor]
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    volumes: ["./blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    networks: [monitor, backend]
  node:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=${DOCKER_BRIDGE_IP:?Set the docker0 address}:9100"]
    volumes: ["/:/host:ro,rslave"]
  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["logs:/tmp/loki"]
    networks: [monitor]
  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - positions:/positions
    networks: [monitor]
  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set dashboard administrator password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/booking-dashboards:ro
      - dashboards:/var/lib/grafana
    networks: [monitor]
networks:
  monitor: {}
  backend:
    external: true
    name: ${APP_NETWORK:?Use the existing lab4 backend network}
volumes:
  metrics: {}
  logs: {}
  positions: {}
  dashboards: {}
